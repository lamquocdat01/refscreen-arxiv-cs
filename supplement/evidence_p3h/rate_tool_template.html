<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xác nhận bằng chứng #43</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#dcdad2;--acc:#1f5f8b;--y:#1e7a46;--n:#a8322a;--q:#8a6a12}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#21211e;--ink:#ecebe6;--mute:#a09f98;--line:#3a3935;--acc:#7db7de;--y:#58c08a;--n:#ee8279;--q:#dcb650}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:6px 0 2px}.sub{color:var(--mute);font-size:14px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.id{font-weight:700;font-size:15px;color:var(--mute)}
.ref{margin:8px 0 12px;font-size:17px}
dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:0 0 12px;font-size:15px}dt{color:var(--mute)}dd{margin:0;word-break:break-word}
.page{border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
a.open{display:inline-block;margin:10px 0;padding:10px 14px;border-radius:8px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;word-break:break-all}
@media(prefers-color-scheme:dark){a.open{color:#10202c}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.sel.y{background:var(--y);color:#fff;border-color:var(--y)}button.sel.n{background:var(--n);color:#fff;border-color:var(--n)}button.sel.q{background:var(--q);color:#fff;border-color:var(--q)}
input[type=text]{width:100%;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.grid button{padding:5px 8px;font-size:13px;min-width:54px}
.grid .y{border-color:var(--y);color:var(--y)}.grid .n{border-color:var(--n);color:var(--n)}.grid .q{border-color:var(--q);color:var(--q)}.grid .cur{outline:2px solid var(--acc)}
.save{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line)}
.save button{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
@media(prefers-color-scheme:dark){.save button{color:#10202c}}
.hint{color:var(--mute);font-size:13px}
</style></head><body><main>
<h1>Xác nhận bằng chứng web — #43 (Amendment 9, mục E)</h1>
<div class="sub">Mở trang, so title và tác giả với chuỗi thư mục. <b>y</b> = đúng tác phẩm được trích · <b>n</b> = không phải / không xem được · <b>?</b> = không chắc. Chỉ chấm theo cái thấy trên trang.</div>
<div id="prog" class="hint"></div><div class="bar"><i id="pb"></i></div>
<div class="card" id="card"></div>
<div class="nav"><button id="prev">← Trước</button><span class="hint">Phím: Y / N / ? chấm · ← → chuyển dòng · O mở trang</span><button id="next">Sau →</button></div>
<div class="grid" id="grid"></div>
<div class="save"><button id="exp">Tải file p3h_evidence_author.csv</button> <span class="hint" id="msg"></span></div>
</main>
<script>
const D=/*DATA*/[];const K='p3h43_author_v1';let A={},cur=0;
try{A=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){A={}}
function save(){try{localStorage.setItem(K,JSON.stringify(A))}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cls(v){return v==='y'?'y':v==='n'?'n':v==='?'?'q':''}
function render(){const r=D[cur],a=A[r.id]||{};
 document.getElementById('card').innerHTML=
 `<div class="id">${r.id} · dòng ${cur+1}/${D.length}</div><div class="ref">${esc(r.ref)}</div>
 <dl><dt>Title</dt><dd>${esc(r.title)}</dd><dt>Tác giả</dt><dd>${esc(r.authors)}</dd><dt>Năm · venue</dt><dd>${esc(r.year)} · ${esc(r.venue)}</dd></dl>
 <div class="page"><dl><dt>Máy kiểm</dt><dd>${esc(r.state)}${r.sim?' · sim '+esc(r.sim):''}</dd>
 <dt>Title trên trang</dt><dd>${esc(r.page_title)||'(máy không đọc được — anh tự xem)'}</dd>
 <dt>Họ khớp</dt><dd>${esc(r.surn)||'—'}</dd></dl>
 <a class="open" id="open" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Mở trang: ${esc(r.url)}</a></div>
 <div class="btns"><button data-v="y" class="${a.v==='y'?'sel y':''}">y — đúng tác phẩm</button><button data-v="n" class="${a.v==='n'?'sel n':''}">n — không phải / không xem được</button><button data-v="?" class="${a.v==='?'?'sel q':''}">? — không chắc</button></div>
 <input type="text" id="note" placeholder="Ghi chú (tuỳ chọn): paywall, khác phiên bản…" value="${esc(a.note)}">`;
 document.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>setv(b.dataset.v));
 document.getElementById('note').oninput=e=>{A[r.id]=Object.assign({},A[r.id],{note:e.target.value});save()};
 const done=D.filter(x=>A[x.id]&&A[x.id].v).length;
 document.getElementById('prog').textContent=`Đã chấm ${done}/${D.length}`;
 document.getElementById('pb').style.width=(100*done/D.length)+'%';
 document.getElementById('grid').innerHTML=D.map((x,i)=>`<button data-i="${i}" class="${cls((A[x.id]||{}).v)} ${i===cur?'cur':''}">${x.id}</button>`).join('');
 document.querySelectorAll('#grid button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});}
function setv(v){const r=D[cur];A[r.id]=Object.assign({},A[r.id],{v});save();render()}
function go(d){cur=Math.max(0,Math.min(D.length-1,cur+d));render();window.scrollTo(0,0)}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
 if(k==='y')setv('y');else if(k==='n')setv('n');else if(k==='?'||k==='/')setv('?');else if(k==='arrowright')go(1);else if(k==='arrowleft')go(-1);else if(k==='o')document.getElementById('open').click()});
function q(s){s=String(s||'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
document.getElementById('exp').onclick=()=>{const miss=D.filter(x=>!(A[x.id]&&A[x.id].v)).length;
 const csv='﻿ID,author_check,note\r\n'+D.map(x=>[x.id,(A[x.id]||{}).v||'',q((A[x.id]||{}).note)].join(',')).join('\r\n')+'\r\n';
 const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='p3h_evidence_author.csv';a.click();
 document.getElementById('msg').textContent=miss?`Đã tải, còn ${miss} dòng chưa chấm.`:'Đã tải đủ. Chép file vào thư mục results\\ của đề tài.'};
render();
</script></body></html>
